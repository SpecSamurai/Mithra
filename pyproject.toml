[project]
name = "interviewer"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.162.4",
    "langchain>=1.5.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
]

[tool.fastapi]
entrypoint = "backend.main:app"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.4",
    "ty>=0.0.101",
    "grandalf>=0.8",
]